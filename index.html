<!DOCTYPE html>
<html lang="en">
        <head>
                <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1">
                <title>I-House Wordle</title>

                <link rel="stylesheet" href="./src/style.css">
        </head>
        <body>
                <header>
                        <h1>I-House Wordle</h1>
                </header>
                <main>
                        <div class="date-selector">
                                <button id="date-today" class="date-btn active">Today</button>
                                <button id="date-tomorrow" class="date-btn">Tomorrow</button>
                        </div>
                        <div style="display:flex;justify-content:center;">
                                <div class="board-module_board"></div>
                        </div>
                        <div class="keyboard"></div>
                </main>

                <div id="toast" class="toast"></div>
                <div id="result-modal" class="modal">
                        <div class="modal-card">
                                <button id="modal-close" class="modal-close">✕</button>
                                <h2 id="result-title"></h2>
                                <p id="result-meta" class="result-meta"></p>
                                <p id="result-score" class="result-score"></p>
                                <pre id="result-grid" class="result-grid"></pre>
                                <button id="share-btn" class="share-btn">Share</button>
                        </div>
                </div>
                <script src="./src/logic.js" type="module"></script>
        </body>
</html>
